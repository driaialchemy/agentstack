# agentstack skill registry — Phase 2 demo skills
# Each skill defines what it may do and under which conditions it may run.

skills:
  - skill_id: structured_data_summary
    display_name: Structured Data Summary
    description: >
      Load synthetic structured records and produce a summary for demo workflows.
    allowed_data_sources:
      - Synthetic structured database
    allowed_workflow_types:
      - Structured data preview
    risk_level: low
    requires_approval: false
    max_records_or_documents: 100
    enabled: true

  - skill_id: document_review_summary
    display_name: Document Review Summary
    description: >
      Load synthetic documents and produce a review summary for demo workflows.
    allowed_data_sources:
      - Synthetic document database
    allowed_workflow_types:
      - Document review preview
    risk_level: medium
    requires_approval: false
    max_records_or_documents: 100
    enabled: true

  - skill_id: report_writer
    display_name: Report Writer
    description: >
      Write a demo report artifact (JSON) from workflow output.
    allowed_data_sources:
